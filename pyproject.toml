[project]
name = "loopmdm-mlx"
version = "0.1.0"
description = "Selective looping of early-middle layers in a masked diffusion LM, in MLX"
requires-python = ">=3.10"
dependencies = ["mlx>=0.22", "numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
